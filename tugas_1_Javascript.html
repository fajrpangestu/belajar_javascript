</head>

<body>

<script>
    
    let tarifbogor = 2000;
    let tarifdepok = 4000;
    let tariflain = 6000;
    let beratpaket = 10;
    let kotatujuan = "jakarta";

    if (kotatujuan === "bogor") {
        console.log(`Tarifnya adalah sebesar: ${tarifbogor * beratpaket}`);
    }
    else if (kotatujuan === "depok") {
        console.log(`Tarifnya adalah sebesar: ${tarifdepok * beratpaket}`);
    }
    else {
        console.log(`Tarifnya adalah sebesar: ${tariflain * beratpaket}`);
    }

</script>
    
</body>
